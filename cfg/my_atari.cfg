FEATURES {
    STARTADDRESS: default = $4000;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0082, size = $007E;

    HEADER:   file = %O, start = $0000, size = $0006;    # HLAVICKA
    RAM:      file = %O, define = yes, start = %S, size = $BC20 - %S;

    TRAILER:  file = %O, start = $0000, size = $0006;    # AUTOSTART
}

SEGMENTS {
    EXEHDR:    load = HEADER,  type = ro, define = yes;

    ZEROPAGE:  load = ZP,      type = zp, optional = yes;
    CODE:      load = RAM,     type = ro, define = yes;
    RODATA:    load = RAM,     type = ro, optional = yes;
    DATA:      load = RAM,     type = rw, optional = yes;
    BSS:       load = RAM,     type = bss, optional = yes;

    FONT:      load = RAM,     type = rw, optional = yes, align = 2048;
    PMG:       load = RAM,     type = bss, optional = yes, align = 2048;
    VRAM:      load = RAM,     type = bss, optional = yes, align = 4096;

    BSSDATA:   load = RAM,     type = bss, optional = yes;

    AUTOSTART: load = TRAILER, type = ro, optional = no;  # AUTOSTART 
}

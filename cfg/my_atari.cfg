FEATURES {
	STARTADDRESS: default = $4000;
}

MEMORY {
    ZP:            file = "", define = yes, start = $0082, size = $007E;
    HEADER:        file = %O,               start = $0000, size = $0006;
    RAM:           file = %O, define = yes, start = %S,    size = $BC20 - %S;
    TRAILER:       file = %O,               start = $0000, size = $0006;
}
SEGMENTS {
    COMHEADER: load = RAM,        type = ro,  define = yes, optional = no;
    CODE:      load = RAM,        type = ro,  define = yes, optional = yes;
    RODATA:    load = RAM,        type = ro                 optional = yes;
    FONT:      load = RAM,        type = rw                 optional = yes, align=2048;
    DATA:      load = RAM,        type = rw                 optional = yes;
    DL:        load = RAM,        type = rw,  define = yes, optional = yes; 
    BSS:       load = RAM,        type = bss, define = yes, optional = yes;
    PMG:       load = RAM,        type = bss, define = yes, optional = yes, align=2048;
    VRAM:      load = RAM,        type = bss, define = yes, optional = yes, align=4096;
    BSSDATA:   load = RAM,        type = bss, define = yes, optional = yes; # data to be loaded - last RAM position
    ZEROPAGE:  load = ZP,         type = zp,                optional = yes;
    EXTZP:     load = ZP,         type = zp,                optional = yes; # to enable modules to be able to link to C and assembler programs
    AUTOSTRT:  load = TRAILER,    type = ro,                optional = yes;
}

<!-- Prism.js syntax highlighting for ZAP! code blocks -->
<!-- Theme: prism (default light). Loaded from cdnjs without SRI hashes —
     SRI was causing browsers to reject the scripts when the hash didn't
     match. For a docs site this trade-off is acceptable. -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>

<!-- Prism core -->
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
  data-manual
></script>

<!-- Extra built-in languages used in the docs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-makefile.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-batch.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- Custom ZAP! language definition -->
<script src="{{ '/assets/prism/prism-zap.js' | relative_url }}" defer></script>

<!-- Fix up code blocks: kramdown+Rouge wraps fenced blocks with
     <div class="language-xxx highlighter-rouge"> but Prism needs
     <code class="language-xxx"> directly. Copy the class from the outer
     wrapper to the inner <code> element, then trigger Prism highlighting. -->
<script>
  window.addEventListener('DOMContentLoaded', function () {
    // Find every div that has a language-xxx class and copy that class
    // down to the inner <code> element so Prism can find it.
    document.querySelectorAll('div[class*="language-"]').forEach(function (wrapper) {
      var langClass = null;
      wrapper.classList.forEach(function (cls) {
        if (cls.indexOf('language-') === 0) {
          langClass = cls;
        }
      });
      if (!langClass) return;
      var code = wrapper.querySelector('pre > code');
      if (code && !code.classList.contains(langClass)) {
        code.classList.add(langClass);
      }
    });

    if (window.Prism) {
      Prism.highlightAll();
    }
  });
</script>

<!-- Small style tweak so the code looks good against just-the-docs background -->
<style>
  pre[class*="language-"],
  code[class*="language-"] {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.85em;
  }
  pre[class*="language-"] {
    border-radius: 6px;
    padding: 1em;
    overflow: auto;
  }
  /* Make ZAP! tokens slightly more distinctive */
  .token.zap-attribute { color: #d9480f; font-weight: 600; }
  .token.zap-preprocessor { color: #5f3dc4; font-weight: 600; }
  .token.zap-type { color: #0b7285; font-weight: 600; }
  .token.zap-storage { color: #862e9c; }
</style>

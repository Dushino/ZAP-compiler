title: ZAP!
description: A high-level language that compiles to 6502/65C02 assembly for Atari 8-bit systems
url: https://dushino.github.io
baseurl: /ZAP-compiler

# just-the-docs theme (supported on GitHub Pages via remote_theme)
remote_theme: just-the-docs/just-the-docs
color_scheme: light

# Plugins (allowlisted by GitHub Pages)
plugins:
  - jekyll-relative-links   # Rewrites [foo](foo.md) to [foo](foo.html) so
                            # the same link works on GitHub blob view AND
                            # on the built Pages site.

relative_links:
  enabled: true
  collections: true

# Markdown / highlighting
# We disable kramdown's built-in highlighter so fenced code blocks render as
# plain <pre><code class="language-xxx">. Prism.js then highlights them in the
# browser, including our custom 'zap' language.
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true
  input: GFM
  hard_wrap: false

# Exclude stale / non-public files from the Jekyll build
exclude:
  - PROGRESS.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Per-page layout and title defined here so individual .md files only need
# a minimal 'nav_order' front matter (keeps them mostly clean on github.com).
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "index.md"
    values:
      title: Home
      permalink: /
  - scope:
      path: "GETTING_STARTED.md"
    values:
      title: Getting Started
  - scope:
      path: "ZAP_LANGUAGE_REFERENCE.md"
    values:
      title: Language Reference
  - scope:
      path: "ADVANCED_TOPICS.md"
    values:
      title: Advanced Topics
  - scope:
      path: "STDLIB.md"
    values:
      title: Standard Library
  - scope:
      path: "ERROR_MESSAGES.md"
    values:
      title: Error Messages
  - scope:
      path: "KNOWN_LIMITATIONS.md"
    values:
      title: Known Limitations
  - scope:
      path: "ARCHITECTURE.md"
    values:
      title: Architecture
  - scope:
      path: "IDE_INTEGRATION.md"
    values:
      title: IDE Integration

heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Footer
footer_content: "ZAP! Compiler — <a href=\"https://github.com/Dushino/ZAP-compiler\">GitHub</a> · GPL v3"

# Repo link in header
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Dushino/ZAP-compiler"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

title: ZAP!
description: A high-level language that compiles to 6502/65C02 assembly for Atari 8-bit systems
url: https://dushino.github.io
baseurl: /ZAP-compiler

# just-the-docs theme (supported on GitHub Pages via remote_theme)
remote_theme: just-the-docs/just-the-docs
color_scheme: light

# Markdown / highlighting
# We disable kramdown's built-in highlighter so fenced code blocks render as
# plain <pre><code class="language-xxx">. Prism.js then highlights them in the
# browser, including our custom 'zap' language.
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true
  input: GFM
  hard_wrap: false

# Exclude stale / non-public files from the Jekyll build
exclude:
  - PROGRESS.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Sidebar navigation — just-the-docs reads 'nav_order' from each page's front matter
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Footer
footer_content: "ZAP! Compiler — <a href=\"https://github.com/Dushino/ZAP-compiler\">GitHub</a> · GPL v3"

# Repo link in header
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Dushino/ZAP-compiler"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

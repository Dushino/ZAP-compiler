MEMORY {
    ZP:       file = "", define = yes, start = $00FE, size = $0002;
    HEADER:   file = %O, start = $0000, size = $0006;
    RAM:      file = %O, define = yes, start = $4000, size = $8000;
    TRAILER:  file = %O, start = $0000, size = $0006;
}

SEGMENTS {
    COMHEADER: load = HEADER,  type = ro, define = yes;
    ZEROPAGE:  load = ZP,      type = zp, optional = yes;
    CODE:      load = RAM,     type = ro, define = yes;
    DATA:      load = RAM,     type = rw, optional = yes;
    RODATA:    load = RAM,     type = ro, optional = yes;
    BSS:       load = RAM,     type = bss, optional = yes, define = yes;
    AUTOSTRT:  load = TRAILER, type = ro, optional = yes;
}
